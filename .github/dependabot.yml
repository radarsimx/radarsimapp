version: 2

updates:
  # Keeps the `uses:` pins in .github/workflows/*.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    # One PR for all action bumps -- they are pinned to major tags, so the
    # updates are almost always in lockstep and not worth separate reviews.
    groups:
      github-actions:
        patterns:
          - "*"

  # Keeps package.json / package-lock.json current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - dependencies
      - javascript
    # Batch minor/patch bumps; majors (electron, koffi, ...) still get their
    # own PR since they are the ones likely to break the native bridge.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
