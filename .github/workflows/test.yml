name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Licenses are locked to the platform they were issued for, so each
          # runner needs its own secret (unless the key is issued "Platform: All").
          - os: ubuntu-latest
            license_secret: TEST_LICENSE_LINUX
          - os: windows-latest
            license_secret: TEST_LICENSE_WINDOWS
          - os: macos-latest
            license_secret: TEST_LICENSE_MACOS

    env:
      # The unit tests never launch Electron, so skip the ~100 MB binary that
      # `npm ci` would otherwise download on every job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 24 is required: the test files are TypeScript and run through
          # Node's native type stripping, with no transpile step.
          node-version: 24
          cache: npm

      # bridge.ts activates any license_RadarSimApp_*.lic / license_RadarSimPy_*.lic
      # it finds in radarsimlib/. Without one the integration suite still runs,
      # but the free tier rejects mesh targets so those cases skip.
      # Absent on fork PRs, which get no secrets -- that must not fail the job.
      - name: Set up license file
        shell: pwsh
        env:
          TEST_LICENSE: ${{ secrets[matrix.license_secret] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEST_LICENSE)) {
            Write-Host "No ${{ matrix.license_secret }} secret; mesh integration tests will skip."
          } else {
            New-Item -ItemType Directory -Force -Path ./radarsimlib | Out-Null
            $path = Join-Path $PWD 'radarsimlib/license_RadarSimPy_CI.lic'
            # WriteAllText gives BOM-less UTF-8 on both PowerShell 5.1 and 7;
            # Out-File -Encoding utf8 differs between them, and a BOM corrupts
            # the first line of the key. Do not "simplify" this to Out-File.
            [System.IO.File]::WriteAllText($path, $env:TEST_LICENSE)
            Write-Host "Wrote $path ($((Get-Item $path).Length) bytes)"
          }

      - name: Install dependencies
        run: npm ci

      # The tests import the built output in dist/, so both of these scripts
      # run the build themselves -- do not assume a previous step left one
      # behind.
      - name: Type-check tests
        run: npm run typecheck:test

      # test/unit/** needs no native library, so it is the same on every
      # platform.
      - name: Run unit tests
        run: npm run test:unit

      # Drives the real radarsimc through RadarSimBridge. Nothing is skipped:
      # if the library for this platform is missing, stale, or cannot run, the
      # suite fails. radarsimcpp falls back to CPU at runtime, so a GPU is not
      # required -- but a build for the runner's platform is.
      #
      # Linux and macOS will fail here until current .so/.dylib are committed.
      - name: Run integration tests
        run: npm run test:integration
