name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest

    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    # Fixes can only be pushed back to branches in this repository. Fork PRs
    # get a read-only token, so for them the job only checks.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a PR, check out the head branch itself (not the merge commit)
          # so a fix commit can be pushed back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe fixes and formatting
        id: fix
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npx biome check --write .
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit pushed with GITHUB_TOKEN does not start new workflow runs,
      # so this cannot loop.
      - name: Commit fixes
        if: steps.fix.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Biome formatting and lint fixes"
          git push

      # Fails on anything the fixer could not resolve (and, on fork PRs, on
      # any formatting or lint problem at all).
      - name: Check
        run: npx biome ci --reporter=github .
